<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Bountyhood mark — Robin Hood's arrow through the bounty target -->
  <defs>
    <linearGradient id="lime" gradientUnits="userSpaceOnUse" x1="40" y1="160" x2="220" y2="96">
      <stop offset="0" stop-color="#84cc16"/>
      <stop offset="1" stop-color="#bef264"/>
    </linearGradient>
  </defs>

  <!-- dark tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#0d0e12"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#2a2e3a" stroke-width="3"/>

  <!-- target rings -->
  <circle cx="128" cy="128" r="84" fill="none" stroke="#a3e635" stroke-opacity="0.38" stroke-width="8"/>
  <circle cx="128" cy="128" r="48" fill="none" stroke="#a3e635" stroke-opacity="0.2" stroke-width="8"/>

  <!-- arrow, pointing up-right -->
  <g transform="rotate(-45 128 128)">
    <line x1="58" y1="128" x2="168" y2="128" stroke="url(#lime)" stroke-width="17" stroke-linecap="round"/>
    <path d="M 158 94 L 226 128 L 158 162 L 172 128 Z" fill="url(#lime)"/>
    <!-- fletching: one clean feather pair sweeping back -->
    <line x1="82" y1="126" x2="54" y2="96" stroke="url(#lime)" stroke-width="15" stroke-linecap="round"/>
    <line x1="82" y1="130" x2="54" y2="160" stroke="url(#lime)" stroke-width="15" stroke-linecap="round"/>
  </g>
</svg>
